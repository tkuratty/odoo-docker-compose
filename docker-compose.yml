version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
    restart: always
    volumes:
      - "odoo-db:/var/lib/postgresql/data"
    # Alpine版は軽量でsysctl設定も少ない

  odoo:
    build:
      context: ./odoo19
      dockerfile: Dockerfile
    container_name: odoo
    depends_on:
      - db
    ports:
      - "18069:8069"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PORT=5432
    volumes:
      - ~/Documents/odoo/addons:/mnt/extra-addons
      - "odoo-data:/var/lib/odoo"
      - "odoo-vscode:/opt/odoo/.vscode"
      - "odoo-home:/root"
      - "odoo-custom-addons:/opt/odoo/custom-addons"
    restart: always

volumes:
  odoo-vscode:
  odoo-home:
  odoo-custom-addons:
  odoo-db:
  odoo-data:
